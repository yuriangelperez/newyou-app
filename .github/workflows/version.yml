# Sube la versión de la app cada vez que algo llega a main.
#   push a main          -> parche: 1.0.0 -> 1.0.1
#   a mano desde Actions -> elegís parche, menor (1.1.0) o mayor (2.0.0)
# Actualiza package.json, package-lock.json y app.json (expo.version, la que ve el usuario
# en la tienda y en el .apk), hace commit y crea la etiqueta vX.Y.Z.
# El commit lo hace github-actions con GITHUB_TOKEN, así que no vuelve a disparar
# este workflow ni los tests (no entra en bucle).
name: Versión

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Qué parte de la versión subir'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# Si llegan dos pushes seguidos, se suben de a uno (no se pisan).
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Subir versión
        env:
          TIPO: ${{ inputs.tipo || 'patch' }}
        run: |
          npm version "$TIPO" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          VERSION="$VERSION" node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = process.env.VERSION;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Commit y etiqueta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app.json
          git commit -m "Versión $VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
