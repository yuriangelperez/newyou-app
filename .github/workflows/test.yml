# Integración continua (Clase 10): cada push y PR corre tipos, lint y tests.
# Si queda en rojo, se arregla el código; no se mergea.
name: Tests

on:
  pull_request:
    branches: [main, datos-yuri, datos-ale]
  push:
    branches: [main, datos-yuri, datos-ale]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Correr tests
        run: npm test -- --coverage
