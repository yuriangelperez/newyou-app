# Subflujo reutilizable: inicia sesión con EMAIL y PASSWORD (pasados con -e).
appId: com.anonymous.newyouapp
tags: [subflujo]
---
- launchApp:
    clearState: true
# La tarjeta de bienvenida aparece en cada inicio sin sesión.
- tapOn:
    id: "bienvenida-cerrar"
    optional: true
- tapOn:
    id: "login-correo"
- inputText: ${EMAIL}
- tapOn:
    id: "login-contrasena"
- inputText: ${PASSWORD}
- tapOn:
    id: "login-boton"
- extendedWaitUntil:
    visible:
      id: "home-buscar"
    timeout: 15000
