- tapOn:
    id: "registro-repetir"
- inputText: "clave123"
- tapOn:
    id: "registro-boton"
- assertVisible: "La contraseña necesita una mayúscula"
- tapOn:
    id: "registro-contrasena"
- eraseText: 20
- inputText: "Clave123"
- tapOn:
    id: "registro-repetir"
- eraseText: 20
- inputText: "Clave124"
- tapOn:
    id: "registro-boton"
